<!DOCTYPE html>
<html lang="en">
<!--
  WORST-CASE RENDERER FIXTURE (the cogchemists 2026-08-24 rule).

  tools/ci/docker_smoke.sh runs with NO ANTHROPIC_API_KEY, so every seat plays
  the scripted baseline and a scripted seat emits no `note` -- which means
  EVERY replay CI produces carries zero LLM text, and nothing that plays a
  replay can exercise the match feed, the radio strip, the crypto panel or a
  full-cap note. This page fills that hole.

  WHAT IT LOADS
  -------------
  The REAL viewer page: it fetches `./index.html` -- the shipped bundle's own
  page, which is `client/replay_broadcast.html` with `chrome_common.js` and
  `wire_constants.js` spliced in by Dockerfile.replay-viewer -- and runs it in
  an iframe. Nothing about the chrome is re-implemented here: the scorebug
  plates, the kill feed, the round chip, the mark rail, the radio strip and the
  crypto panel are drawn by `window.MpeChrome` and by the inherited chrome in
  that page, under that page's CSS, at that page's own layout.

  The ONE thing stubbed is the transport. The page reads its frames from
  `MpeStaticReplay.createCore(config)` (the OffscreenCanvas Worker that owns
  the board); a head shim shadows that factory, captures the page's own
  `coreConfig` and hands the page a worst-case chrome frame through
  `config.onText` -- byte-for-byte the same entry point the Worker uses. So the
  frame is fake and every line of layout is real, which is exactly the
  inversion CI needs: CI can make a real replay but never a talkative one.

  THE WORST CASE
  --------------
    * a FULL-CAP 160-rune note on ALL FOUR seats in the same frame, in the
      feed (MAX_FEED is 4, so four notes is the feed's tallest possible state);
    * a non-silent symbol on all four particles, in the radio strip and in the
      four scorebug plates;
    * the crypto panel populated -- the tallest game block, three belief rows
      plus the key row;
    * the mark rail with four marks and their coverage;
    * every feed-bearing event kind in one frame (roundstart, word, onpoint,
      decode, tag, roundover);
    * rendered at 360 / 620 / 1280 px board widths, each played for long
      enough that the feed's 250 ms slide-in, the banner pop and the radio
      flash have all SETTLED before anything is measured -- 360 px is the
      width of the softmax.com featured-match iframe.

  HOW IT IS MEASURED
  ------------------
  Twice, on purpose.

  1. In the DOM, against the real geometry: every visible text node's client
     rect must lie inside the frame, and no element carrying a SENTENCE (a
     note) may be clipped by its own box (scrollWidth > clientWidth). A
     violation sets data-replay-error, which `viewer_smoke.mjs` fails on
     immediately.

  2. On a canvas, so the shared harness can gate it: after the real chrome has
     laid out, every text run is transcribed onto a per-width canvas at the
     position and in the font the browser actually used -- one fillText per
     rendered LINE, split by the range rects the layout produced. The layout is
     the chrome's; the canvas draw only exposes it to
     `CanvasRenderingContext2D.prototype.fillText`, which is the only thing
     `viewer_smoke.mjs --strict-text-bounds` can see. The real viewer renders
     its board in an OffscreenCanvas Worker and lays out every string in the
     DOM, so without this transcription the harness reports `total: 0` -- which
     the acceptance checklist rightly calls evidence of nothing.

  The page also self-checks its own inputs: the note is exactly the 160-rune
  MaxNoteRunes cap and every symbol is exactly one rune, and the note that
  reaches the DOM is compared against the note that went in, so a quietly
  shortened string fails here instead of leaving a green fixture that tests
  nothing.
-->
<head>
<meta charset="utf-8">
<title>particle-worlds worst-case renderer fixture</title>
<style>
  html, body { margin: 0; background: #0c0906; color: #f2e8d8;
               font-family: system-ui, sans-serif; }
  .frame { margin: 6px; }
  .cap { font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase;
         color: #a4988a; padding: 2px 4px; }
  iframe { border: 0; display: block; background: #171009; }
  canvas { display: block; background: #171009; }
</style>
</head>
<body>
<div id="frames"></div>

<!-- The head shim injected into the REAL page. It shadows the transport
     factory so the page's own coreConfig can be driven with a worst-case
     frame; every other line of the page runs untouched. -->
<script type="text/plain" id="page-hook">
(function () {
  'use strict';
  var stub = {
    start: function () {},
    stop: function () {},
    sendCommand: function () {},
    clickMap: function () {},
    zoomAt: function () {},
    setZoom: function () {},
    panBy: function () {},
    panByMap: function () {},
    panTo: function () {},
    resetView: function () {},
    attachMinimap: function () {},
    setViewportFit: function () {},
    getTransform: function () {
      return { scale: 1, offsetX: 0, offsetY: 0, nativeW: 1235, nativeH: 659,
               zoom: 1, minZoom: 1, maxZoom: 12, fitScale: 1, focusX: 0,
               focusY: 0, visW: 1235, visH: 659 };
    },
    getPaceStats: function () {
      return { enabled: false, queued: 0, presented: 0, interval: 1000 / 24,
               draws: 0 };
    }
  };
  function createCore(config) {
    window.__fixtureConfig = config;
    return stub;
  }
  var real = null;
  Object.defineProperty(window, 'MpeStaticReplay', {
    configurable: true,
    get: function () { return { createCore: createCore, __real: real }; },
    set: function (value) { real = value; }
  });
})();
</script>

<script>
(function () {
  'use strict';

  // ---------------------------------------------------------------------
  // The worst case.
  // ---------------------------------------------------------------------
  // A 160-RUNE note -- exactly MaxNoteRunes, the cap the server enforces --
  // ending in a 4-byte emoji so the rune-boundary path is real here too.
  var NOTE = 'hold at teal south flank until the greens commit and then break ' +
             'for the goal in one straight run, never crossing the middle ' +
             'while an eye is close 0123456789012\uD83D\uDE80';
  var WIDTHS = [360, 620, 1280];
  var BOARD_ASPECT = 1235 / 659;
  var SEATS = [
    { seat: 0, colour: 'red', alias: 'RED-alpha', name: 'daveey',
      role: 'speaker', sym: 'F' },
    { seat: 1, colour: 'blue', alias: 'BLUE-alpha', name: 'daveey-1',
      role: 'listener', sym: 'B' },
    { seat: 2, colour: 'green', alias: 'GREEN-alpha',
      name: 'particle-worlds-drifter', role: 'eavesdropper', sym: 'H' },
    { seat: 3, colour: 'yellow', alias: 'YELLOW-alpha',
      name: 'particle-worlds-beeline', role: 'eavesdropper', sym: 'C' }
  ];
  var MARKS = ['amber', 'teal', 'violet', 'bone'];

  var failure = '';
  function fail(message) {
    if (failure) return;
    failure = message;
    document.documentElement.setAttribute('data-replay-error', message);
  }

  function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
  function raf(win) {
    return new Promise(function (r) { win.requestAnimationFrame(function () { r(); }); });
  }

  // One chrome frame, shaped exactly like src/mpe/broadcast.nim's
  // buildStateJson: a crypto round (the tallest game block) with every seat
  // talking and every seat's note at the cap.
  function worstCaseFrame(tick, turn, withEvents) {
    var teams = {};
    var roster = [];
    SEATS.forEach(function (s) {
      teams[s.colour] = { lives: 1, alive: 1, score: 0, prog: 0 };
      roster.push({
        slot: s.seat, name: s.name, team: s.colour, alive: true, lives: 0,
        kills: 0, deaths: 0, hp: 100, policy: s.name
      });
    });
    var marks = MARKS.map(function (colour, i) {
      return {
        i: i, x: 200 + i * 280, y: 170 + (i % 2) * 300, c: colour,
        near: 40 + i * 90, close: 985 - i * 240, goal: i === 1
      };
    });
    var state = {
      t: tick, mt: 540, ph: 'playing', lob: 0, pl: true, sp: 1, mx: 2160,
      st: 0, lp: false, sk: false, ff: false, en: true, mm: -1, bs: 1,
      pov: -1, teams: teams, roster: roster, events: [],
      round: 3, rounds: 4, mode: 'crypto', turnTicks: 270, turn: turn, turns: 2,
      marks: marks,
      comm: SEATS.map(function (s) {
        return { seat: s.seat, sym: s.sym, since: 0 };
      }),
      roles: SEATS.map(function (s) { return s.role; }),
      roundScores: SEATS.map(function () { return [641, 598, 487]; }),
      livePermille: [583, 512, 402, 108],
      episodePermille: [641, 598, 487, 410],
      bumps: [14, 9, 22, 6],
      crypto: {
        goal: 1, colour: 'teal',
        key: [['D', 'amber'], ['F', 'teal'], ['B', 'violet'], ['G', 'bone']],
        beliefs: SEATS.slice(1).map(function (s, i) {
          return {
            seat: s.seat, alias: s.alias, mark: i === 0 ? 1 : 3,
            markColour: i === 0 ? 'teal' : 'bone',
            settled: 12 + i * 24, right: i === 0
          };
        })
      },
      // The commander lines: a FULL-CAP note on every seat in one frame.
      directives: SEATS.map(function (s) {
        return {
          round: 3, turn: turn, seat: s.seat, alias: s.alias,
          intent: 'go', target: { x: 640, y: 320 }, symbol: s.sym, note: NOTE
        };
      })
    };
    if (withEvents) {
      state.events = [
        { k: 'roundstart', t: tick, round: 3, rounds: 4, mode: 'crypto',
          roles: SEATS.map(function (s) { return s.role; }) }
      ].concat(SEATS.map(function (s) {
        return { k: 'word', t: tick, by: s.seat, colour: s.colour,
                 alias: s.alias, symbol: s.sym };
      })).concat([
        { k: 'onpoint', t: tick, by: 1, colour: 'blue', alias: 'BLUE-alpha',
          mark: 1, markColour: 'teal' },
        { k: 'decode', t: tick, by: 2, colour: 'green', alias: 'GREEN-alpha',
          mark: 1, markColour: 'teal', right: true, settled: 36 },
        { k: 'tag', t: tick, by: 3, colour: 'yellow', alias: 'YELLOW-alpha',
          seconds: 42 },
        { k: 'roundover', t: tick, round: 3, mode: 'crypto',
          permille: [641, 598, 487, 410] }
      ]);
    }
    return JSON.stringify(state);
  }

  // ---------------------------------------------------------------------
  // Load the REAL page.
  // ---------------------------------------------------------------------
  function loadRealPage() {
    return fetch('./index.html', { cache: 'no-store' }).then(function (res) {
      if (!res.ok) throw new Error('index.html: HTTP ' + res.status);
      return res.text();
    }).then(function (html) {
      if (html.indexOf('particle-worlds additions to the inherited coworld-ctf chrome') < 0) {
        throw new Error('index.html carries no particle-worlds chrome block');
      }
      if (html.indexOf('chrome_common.js') < 0) {
        throw new Error('index.html has no chrome_common.js splice');
      }
      var hook = document.getElementById('page-hook').textContent;
      var at = html.indexOf('<head>');
      if (at < 0) throw new Error('index.html has no <head>');
      return html.slice(0, at + 6) + '\n<script>' + hook + '<\/script>\n' +
        html.slice(at + 6);
    });
  }

  // ---------------------------------------------------------------------
  // Transcribe the laid-out DOM text onto a canvas, one fillText per rendered
  // LINE, at the position and in the font the browser used. See the header:
  // the layout is the chrome's, this only exposes it to the harness.
  // ---------------------------------------------------------------------
  function applyTransform(text, transform) {
    if (transform === 'uppercase') return text.toUpperCase();
    if (transform === 'lowercase') return text.toLowerCase();
    if (transform === 'capitalize') {
      return text.replace(/(^|\s)(\S)/g, function (m, a, b) {
        return a + b.toUpperCase();
      });
    }
    return text;
  }

  function visible(el, win) {
    for (var node = el; node && node.nodeType === 1; node = node.parentElement) {
      var style = win.getComputedStyle(node);
      if (style.display === 'none' || style.visibility === 'hidden') return false;
      if (parseFloat(style.opacity) === 0) return false;
    }
    return true;
  }

  // Every rendered line of one text node: its exact substring, its rect and
  // the style it was drawn with.
  function linesOf(node, win) {
    var out = [];
    var parent = node.parentElement;
    if (!parent) return out;
    var style = win.getComputedStyle(parent);
    var range = win.document.createRange();
    range.selectNodeContents(node);
    var rects = range.getClientRects();
    if (!rects.length) return out;
    var groups = [];
    if (rects.length === 1) {
      groups.push({ from: 0, to: node.data.length, rect: rects[0] });
    } else {
      // Multi-line: walk characters so each drawn line carries exactly the
      // text that line rendered, never the whole string on one line.
      var current = null;
      for (var i = 0; i < node.data.length; i++) {
        range.setStart(node, i);
        range.setEnd(node, i + 1);
        var r = range.getBoundingClientRect();
        if (!r.width && !r.height) {
          if (current) current.to = i + 1;   // collapsed space inside a line
          continue;
        }
        if (current && Math.abs(r.top - current.rect.top) < 1) {
          current.to = i + 1;
          current.rect = {
            left: Math.min(current.rect.left, r.left),
            top: Math.min(current.rect.top, r.top),
            right: Math.max(current.rect.right, r.right),
            bottom: Math.max(current.rect.bottom, r.bottom)
          };
        } else {
          current = { from: i, to: i + 1,
                      rect: { left: r.left, top: r.top, right: r.right,
                              bottom: r.bottom } };
          groups.push(current);
        }
      }
    }
    groups.forEach(function (group) {
      var text = applyTransform(node.data.slice(group.from, group.to), style.textTransform)
        .replace(/\s+/g, ' ').trim();
      if (!text) return;
      out.push({
        text: text,
        rect: group.rect,
        font: style.fontStyle + ' ' + style.fontWeight + ' ' + style.fontSize +
          ' ' + style.fontFamily,
        letterSpacing: style.letterSpacing === 'normal' ? '0px' : style.letterSpacing,
        wordSpacing: style.wordSpacing === 'normal' ? '0px' : style.wordSpacing,
        colour: style.color,
        owner: parent
      });
    });
    return out;
  }

  function collectLines(win) {
    var doc = win.document;
    var walker = doc.createTreeWalker(doc.body, NodeFilter.SHOW_TEXT, {
      acceptNode: function (node) {
        if (!node.data || !node.data.trim()) return NodeFilter.FILTER_REJECT;
        var parent = node.parentElement;
        if (!parent) return NodeFilter.FILTER_REJECT;
        var tag = parent.tagName;
        if (tag === 'SCRIPT' || tag === 'STYLE' || tag === 'TITLE') {
          return NodeFilter.FILTER_REJECT;
        }
        if (!visible(parent, win)) return NodeFilter.FILTER_REJECT;
        return NodeFilter.FILTER_ACCEPT;
      }
    });
    var lines = [];
    for (var node = walker.nextNode(); node; node = walker.nextNode()) {
      lines = lines.concat(linesOf(node, win));
    }
    return lines;
  }

  function transcribe(lines, width, height, label) {
    var host = document.createElement('div');
    host.className = 'frame';
    var cap = document.createElement('div');
    cap.className = 'cap';
    cap.textContent = label;
    host.appendChild(cap);
    var canvas = document.createElement('canvas');
    canvas.width = width;
    canvas.height = height;
    host.appendChild(canvas);
    document.getElementById('frames').appendChild(host);
    var g = canvas.getContext('2d');
    g.fillStyle = '#171009';
    g.fillRect(0, 0, width, height);
    g.textAlign = 'left';
    g.textBaseline = 'top';
    var outside = [];
    lines.forEach(function (line) {
      g.save();
      g.font = line.font;
      if ('letterSpacing' in g) g.letterSpacing = line.letterSpacing;
      if ('wordSpacing' in g) g.wordSpacing = line.wordSpacing;
      g.fillStyle = line.colour;
      g.fillText(line.text, line.rect.left, line.rect.top);
      g.restore();
      var r = line.rect;
      if (r.left < -1 || r.top < -1 || r.right > width + 1 ||
          r.bottom > height + 1) {
        outside.push(line.text);
      }
    });
    return outside;
  }

  // ---------------------------------------------------------------------
  // Drive one width.
  // ---------------------------------------------------------------------
  function renderAt(iframe, width, turn) {
    var height = Math.round(width / BOARD_ASPECT);
    var win = iframe.contentWindow;
    iframe.style.width = width + 'px';
    iframe.style.height = height + 'px';
    var config = win.__fixtureConfig;
    return raf(win).then(function () { return raf(win); }).then(function () {
      config.onStatus('open');
      // Three frames: the first lands the state and the events, the rest let
      // the feed's slide-in, the banner pop and the radio flash settle so
      // nothing is measured mid-animation.
      config.onText(worstCaseFrame(600 + turn * 4, turn, true));
      return raf(win);
    }).then(function () {
      config.onText(worstCaseFrame(601 + turn * 4, turn, false));
      config.onFirstFrame();
      return sleep(500);
    }).then(function () {
      config.onText(worstCaseFrame(602 + turn * 4, turn, false));
      return sleep(200);
    }).then(function () {
      // The notes have to be in the DOM, at full length, before anything is
      // measured -- a fixture that quietly lost its own worst case is worse
      // than no fixture.
      var notes = win.document.querySelectorAll('#killfeed .mpe-note');
      var full = 0;
      for (var i = 0; i < notes.length; i++) {
        if (notes[i].textContent === NOTE) full += 1;
        if (notes[i].scrollWidth > notes[i].clientWidth + 1) {
          fail('a full-cap note is clipped by its own box at ' + width +
               'px (' + notes[i].scrollWidth + ' > ' + notes[i].clientWidth + ')');
        }
      }
      if (full !== SEATS.length) {
        fail('at ' + width + 'px the feed carries ' + full +
             ' full-length notes, not ' + SEATS.length);
      }
      var lines = collectLines(win);
      if (lines.length < 8) {
        fail('at ' + width + 'px the real chrome laid out only ' + lines.length +
             ' text runs');
      }
      var outside = transcribe(lines, width, height, width + ' px board');
      if (outside.length) {
        fail(outside.length + ' text run(s) fell outside the ' + width +
             'px frame, first: ' + JSON.stringify(outside[0].slice(0, 60)));
      }
    });
  }

  // ---------------------------------------------------------------------
  // Run.
  // ---------------------------------------------------------------------
  function selfCheckInputs() {
    var runes = Array.from(NOTE).length;
    if (runes !== 160) {
      fail('fixture note is ' + runes + ' runes, not the 160-rune MaxNoteRunes cap');
      return false;
    }
    for (var i = 0; i < SEATS.length; i++) {
      if (Array.from(SEATS[i].sym).length !== 1) {
        fail('a fixture symbol is not exactly one rune');
        return false;
      }
    }
    return true;
  }

  function waitForConfig(iframe) {
    var deadline = Date.now() + 20000;
    return new Promise(function (resolve, reject) {
      (function poll() {
        var win = iframe.contentWindow;
        if (win && win.__fixtureConfig && win.document.getElementById('killfeed')) {
          resolve();
          return;
        }
        if (Date.now() > deadline) {
          reject(new Error('the real page never built its chrome'));
          return;
        }
        setTimeout(poll, 50);
      })();
    });
  }

  if (!selfCheckInputs()) return;

  loadRealPage().then(function (html) {
    var host = document.createElement('div');
    host.className = 'frame';
    var cap = document.createElement('div');
    cap.className = 'cap';
    cap.textContent = 'the real viewer page, driven with the worst case';
    host.appendChild(cap);
    var iframe = document.createElement('iframe');
    iframe.id = 'page';
    iframe.style.width = WIDTHS[0] + 'px';
    iframe.style.height = Math.round(WIDTHS[0] / BOARD_ASPECT) + 'px';
    host.appendChild(iframe);
    document.getElementById('frames').appendChild(host);
    iframe.srcdoc = html;
    return waitForConfig(iframe).then(function () {
      var chain = Promise.resolve();
      WIDTHS.forEach(function (width, i) {
        chain = chain.then(function () {
          if (failure) return null;
          return renderAt(iframe, width, i + 1);
        });
      });
      return chain;
    });
  }).then(function () {
    if (failure) return;
    // Same signal, and in the same order, as the real shell: the attribute
    // goes up AFTER the frames are drawn, never before.
    requestAnimationFrame(function () {
      document.documentElement.setAttribute('data-replay-loaded', 'true');
    });
  }).catch(function (error) {
    fail(String(error && error.message || error));
  });
})();
</script>
</body>
</html>
