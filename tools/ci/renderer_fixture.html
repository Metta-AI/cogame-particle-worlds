<!DOCTYPE html>
<html lang="en">
<!--
  WORST-CASE RENDERER FIXTURE (the cogchemists 2026-08-24 rule).

  tools/ci/docker_smoke.sh runs with NO ANTHROPIC_API_KEY, so every seat plays
  the scripted baseline and a scripted seat emits no `note` -- which means
  EVERY replay CI produces carries zero LLM text, and nothing that plays a
  replay can exercise the match feed, the radio strip, the crypto panel or a
  full-cap note. This page is the gate for all of it, and it runs the REAL
  code both ways round:

    * THE RENDERER IS THE SHIPPED ONE. The page fetches `index.html` -- the
      bundle's own copy of client/replay_broadcast.html, spliced with
      client/chrome_common.js exactly as the platform serves it -- and boots it
      inside three iframes. The only thing replaced is the wasm shell
      (static_replay.js): a stub `window.MpeStaticReplay` hands the page a
      core that draws no board and reports a fitted transform, which is what
      lets a fixture feed frames with no replay, no worker and no wasm. Every
      string measured below is laid out by renderScorebug / renderClock /
      renderTransport / the feed / window.MpeChrome -- the code that ships.
    * THE FRAME IS THE SHIPPED SERVER'S. `renderer_fixture_frame.json` is
      written by tools/gen_fixture_frame.nim from broadcast.buildStateJson over
      a real four-round episode, and tests/test_viewer.nim fails if it drifts
      from the server. It is chosen to hurt: a FULL-CAP 160-rune note on every
      seat, a non-silent symbol on all four particles, the crypto decode panel
      populated, the mark rail full, one feed row of every kind the sim emits
      at once, and the endcard with four rounds of stats.

  MEASUREMENT. tools/ci/viewer_smoke.mjs instruments CanvasRenderingContext2D
  in the top frame, and this game's chrome is DOM, not canvas -- so after the
  real chrome has laid the frame out, every rendered line of text is MIRRORED
  onto a top-frame canvas of the iframe's exact size, at the exact rectangle
  the browser laid it out in, in the same font. A line the chrome puts where
  there is no room lands outside the canvas and `--strict-text-bounds` turns
  the job red; nothing else about the drawing is invented here.

  Boards: 360 / 620 / 1280 px -- 360 px is the width of the softmax.com
  featured-match iframe, which is where a plate name collapses if .plate-name
  is wrong -- and each is measured twice, mid-round and on the endcard.
-->
<head>
<meta charset="utf-8">
<title>particle-worlds renderer fixture</title>
<style>
  body {
    margin: 0; background: #0c0906; color: #f2e8d8;
    font: 12px system-ui, sans-serif;
  }
  .frame { margin: 8px; border: 1px solid #2c2219; display: inline-block;
           vertical-align: top; }
  .cap { font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase;
         color: #a4988a; padding: 2px 4px; }
  iframe { border: 0; display: block; background: #171009; }
  canvas { display: block; background: #0c0906; }
</style>
</head>
<body>
<div id="frames"></div>
<script>
(function () {
  'use strict';

  var WIDTHS = [360, 620, 1280];
  var NOTE_RUNES = 160;          // MaxNoteRunes, the cap the server enforces
  var MIN_STRINGS = 40;          // a page that drew less than this drew nothing

  function fail(message) {
    document.documentElement.setAttribute('data-replay-error', String(message));
  }

  function runes(text) { return Array.from(text).length; }

  // ---- the shipped page, with the wasm shell replaced by a stub core ------
  // The stub is the ONLY substitution: it captures coreConfig.onText (the
  // page's own frame entry point, the same one the Worker feeds in the
  // bundle) and reports the fitted transform a fixed arena always has.
  var SHIM = [
    '<scr' + 'ipt>',
    '(function () {',
    '  var transform = { scale: 1, offsetX: 0, offsetY: 0, nativeW: 1235,',
    '    nativeH: 659, zoom: 1, minZoom: 1, maxZoom: 1, fitScale: 1,',
    '    focusX: 0, focusY: 0, visW: 1235, visH: 659 };',
    '  window.__mpeFixture = { booted: false, feed: null };',
    '  window.MpeStaticReplay = {',
    '    createCore: function (config) {',
    '      window.__mpeFixture.feed = function (state) {',
    '        config.onText(JSON.stringify(state));',
    '      };',
    '      return {',
    '        start: function () { window.__mpeFixture.booted = true; },',
    '        sendCommand: function () {},',
    '        setViewportFit: function () {},',
    '        getTransform: function () { return transform; },',
    '        resetView: function () {},',
    '        clickMap: function () {}',
    '      };',
    '    }',
    '  };',
    '})();',
    '</scr' + 'ipt>'
  ].join('\n');

  function splice(html) {
    var shellTag = '<script src="./static_replay.js"><\/script>';
    if (html.indexOf(shellTag) >= 0) return html.replace(shellTag, SHIM);
    // A raw client/replay_broadcast.html (no bundle): the shell marker is
    // still a comment, and chrome_common.js has to be spliced in as well.
    if (html.indexOf('<!-- BROADCAST_CORE -->') >= 0) {
      return html
        .replace('<!-- BROADCAST_CORE -->', SHIM)
        .replace('<!-- CHROME_COMMON -->',
                 '<scr' + 'ipt src="./chrome_common.js"><\/scr' + 'ipt>');
    }
    throw new Error('the viewer page carries neither static_replay.js nor ' +
      'the BROADCAST_CORE marker: nothing to boot');
  }

  function boardHeight(width) {
    // The board's own aspect plus room for the reserved scorebug and
    // transport bands, which is the shape the platform embeds.
    return Math.round(width * 659 / 1235) + 150;
  }

  function raf(win) {
    return new Promise(function (resolve) {
      win.requestAnimationFrame(function () {
        win.requestAnimationFrame(function () { resolve(); });
      });
    });
  }

  function openBoard(html, width, label) {
    return new Promise(function (resolve, reject) {
      var host = document.createElement('div');
      host.className = 'frame';
      var cap = document.createElement('div');
      cap.className = 'cap';
      cap.textContent = label;
      host.appendChild(cap);
      var iframe = document.createElement('iframe');
      iframe.width = width;
      iframe.height = boardHeight(width);
      iframe.setAttribute('title', label);
      host.appendChild(iframe);
      document.getElementById('frames').appendChild(host);
      iframe.addEventListener('load', function () {
        var win = iframe.contentWindow;
        if (!win.__mpeFixture || typeof win.__mpeFixture.feed !== 'function') {
          reject(new Error('the viewer page never built its core at ' + label +
            ' (window.MpeStaticReplay was not used)'));
          return;
        }
        resolve({ host: host, iframe: iframe, win: win,
                  doc: iframe.contentDocument, width: width,
                  height: boardHeight(width) });
      });
      iframe.addEventListener('error', function () {
        reject(new Error('the viewer page failed to load at ' + label));
      });
      iframe.srcdoc = html;
    });
  }

  // ---- mirror the laid-out DOM text onto a measurable canvas --------------
  // One fillText per LINE BOX, at the rectangle the browser gave that line and
  // in the font it was drawn in. Wrapped text is split on its real line
  // breaks, so a wrapped remark is measured line by line rather than as one
  // impossibly wide string.
  function lineRuns(doc, node) {
    var text = node.nodeValue;
    var range = doc.createRange();
    var runsOut = [];
    var start = -1, prevTop = null, prevEnd = -1;
    for (var i = 0; i < text.length; i++) {
      range.setStart(node, i);
      range.setEnd(node, i + 1);
      var r = range.getBoundingClientRect();
      if (r.width === 0 && r.height === 0) continue;   // collapsed whitespace
      if (start < 0) { start = i; prevTop = r.top; }
      else if (Math.abs(r.top - prevTop) > 0.5) {
        runsOut.push([start, prevEnd + 1]);
        start = i;
        prevTop = r.top;
      }
      prevEnd = i;
    }
    if (start >= 0) runsOut.push([start, prevEnd + 1]);
    return runsOut.map(function (span) {
      range.setStart(node, span[0]);
      range.setEnd(node, span[1]);
      var box = range.getBoundingClientRect();
      return { text: text.slice(span[0], span[1]).trim(), box: box };
    }).filter(function (run) { return run.text.length > 0; });
  }

  function clips(win, el) {
    // Text the browser CLIPS (a nameplate in an ellipsising plate) is only
    // drawn as far as its box: mirroring the whole string would report an
    // overflow the viewer never shows. Text nothing clips is mirrored whole,
    // which is what makes a real overflow visible to --strict-text-bounds.
    for (var node = el, depth = 0; node && depth < 6;
         node = node.parentElement, depth++) {
      var css = win.getComputedStyle(node);
      if (css.overflow !== 'visible' || css.textOverflow === 'ellipsis') {
        return true;
      }
    }
    return false;
  }

  function fitted(g, text, width) {
    if (g.measureText(text).width <= width + 1) return text;
    var cut = text;
    while (cut.length > 1 && g.measureText(cut + '\u2026').width > width) {
      cut = cut.slice(0, -1);
    }
    return cut + '\u2026';
  }

  function mirror(board, label) {
    var canvas = document.createElement('canvas');
    canvas.width = board.width;
    canvas.height = board.height;
    board.host.appendChild(canvas);
    var g = canvas.getContext('2d');
    var doc = board.doc, win = board.win;
    var walker = doc.createTreeWalker(doc.body, NodeFilter.SHOW_TEXT, null);
    var drawn = 0, node, budget = 24000;
    while ((node = walker.nextNode()) !== null) {
      if (!node.nodeValue || !node.nodeValue.trim()) continue;
      var el = node.parentElement;
      if (!el || el.tagName === 'SCRIPT' || el.tagName === 'STYLE') continue;
      var css = win.getComputedStyle(el);
      if (css.display === 'none' || css.visibility === 'hidden' ||
          parseFloat(css.opacity) === 0) continue;
      var host = el.offsetParent;
      if (!host && css.position !== 'fixed' && el !== doc.body) continue;
      budget -= node.nodeValue.length;
      if (budget < 0) break;
      var clipped = clips(win, el);
      var elBox = clipped ? el.getBoundingClientRect() : null;
      var fontSize = parseFloat(css.fontSize) || 12;
      g.font = css.fontStyle + ' ' + css.fontWeight + ' ' + css.fontSize +
        ' ' + css.fontFamily;
      g.fillStyle = css.color;
      g.textBaseline = 'alphabetic';
      g.textAlign = 'left';
      var runsHere = lineRuns(doc, node);
      for (var i = 0; i < runsHere.length; i++) {
        var run = runsHere[i];
        // A range's rect is the text's own ink, unclipped -- so a clipped
        // element is measured against the BOX the browser clips it to, which
        // is what the viewer actually shows.
        var body = clipped
          ? fitted(g, run.text,
                   Math.max(0, Math.min(run.box.width,
                                        elBox.right - run.box.left)))
          : run.text;
        // The line's baseline: its box top plus the font's ascent, which is
        // where the browser drew it.
        g.fillText(body, run.box.left, run.box.top + fontSize * 0.8);
        drawn += 1;
      }
    }
    return { canvas: canvas, drawn: drawn, label: label };
  }

  // ---- the run -----------------------------------------------------------
  function checkRendered(board, frame) {
    var doc = board.doc;
    var text = (doc.body.textContent || '').toLowerCase();
    var missing = [];
    // The chrome really ran: the plates, the round chip, the mark rail, the
    // radio strip, the crypto panel and the feed all have content.
    if (doc.querySelectorAll('.plate').length !== 4) missing.push('4 plates');
    if (!doc.getElementById('mpe-round')) missing.push('#mpe-round');
    var rail = doc.getElementById('mpe-rail');
    if (!rail || !rail.children.length) missing.push('#mpe-rail chips');
    var radio = doc.getElementById('mpe-radio');
    if (!radio || radio.children.length !== 4) missing.push('#mpe-radio');
    var crypto = doc.getElementById('mpe-crypto');
    if (!crypto || !crypto.classList.contains('on')) missing.push('#mpe-crypto');
    if (doc.querySelectorAll('.feed-row').length < 4) missing.push('feed rows');
    if (!doc.querySelectorAll('#scrub .beat-marker').length) {
      missing.push('beat markers');
    }
    // And the strings are still FULL LENGTH: one quietly shortened remark
    // leaves this page passing while testing nothing.
    var note = frame.playing.directives[0].note;
    if (runes(note) !== NOTE_RUNES) {
      missing.push('the fixture note is ' + runes(note) + ' runes, not ' +
        NOTE_RUNES);
    } else if (text.indexOf(note.toLowerCase()) < 0) {
      missing.push('the full-cap note never reached the feed');
    }
    var names = frame.playing.roster.map(function (p) { return p.name; });
    for (var i = 0; i < names.length; i++) {
      if (text.indexOf(names[i].toLowerCase()) < 0) {
        missing.push('policy name ' + names[i]);
      }
    }
    return missing;
  }

  function settled(state) {
    // The same frame with nothing new to announce.
    var copy = JSON.parse(JSON.stringify(state));
    copy.events = [];
    return copy;
  }

  function quiet(state) {
    // The same events with no commander lines behind them.
    var copy = JSON.parse(JSON.stringify(state));
    copy.directives = [];
    return copy;
  }

  function main() {
    var frame = null, page = null;
    return fetch('./renderer_fixture_frame.json')
      .then(function (res) {
        if (!res.ok) throw new Error('renderer_fixture_frame.json: ' + res.status);
        return res.json();
      })
      .then(function (json) {
        frame = json;
        for (var i = 0; i < frame.playing.comm.length; i++) {
          var sym = frame.playing.comm[i].sym;
          if (runes(sym) !== 1) throw new Error('symbol ' + sym + ' is not one rune');
          if (sym === '-') throw new Error('the fixture must speak on every seat');
        }
        return fetch('./index.html');
      })
      .then(function (res) {
        if (!res.ok) {
          // Outside a built bundle the raw page sits next to this file.
          return fetch('./replay_broadcast.html').then(function (raw) {
            if (!raw.ok) throw new Error('no viewer page to load (' + res.status + ')');
            return raw.text();
          });
        }
        return res.text();
      })
      .then(function (html) {
        page = splice(html);
        var chain = Promise.resolve(0);
        var totalDrawn = 0;
        var problems = [];
        WIDTHS.forEach(function (width) {
          chain = chain.then(function () {
            return openBoard(page, width, width + ' px');
          }).then(function (board) {
            // 1. The entrance: the first frame arrives on a page still showing
            //    its locker-room curtain and carries every event kind at once.
            //    #killfeed keeps MAX_FEED = 4 rows and the directive rows are
            //    pushed LAST, so what settles is the worst case the checklist
            //    asks for: a full-cap remark on EVERY seat, all four at once.
            board.win.__mpeFixture.feed(frame.playing);
            return raf(board.win).then(function () {
              // 2. Settle: the same tick again with no events, so the layout
              //    quiesces without pushing rows over the four remarks.
              board.win.__mpeFixture.feed(settled(frame.playing));
              return raf(board.win);
            }).then(function () {
              problems = problems.concat(checkRendered(board, frame).map(
                function (m) { return width + ' px: ' + m; }));
              totalDrawn += mirror(board, width + ' px remarks').drawn;
              // 3. The wire: the same events with no directives behind them,
              //    so every feed row kind the sim emits is measured too.
              board.win.__mpeFixture.feed(quiet(frame.playing));
              return raf(board.win);
            }).then(function () {
              if (board.doc.querySelectorAll('.feed-row').length < 4) {
                problems.push(width + ' px: the wire drew no event rows');
              }
              totalDrawn += mirror(board, width + ' px the wire').drawn;
              // 4. And the endcard, the tallest block this chrome draws.
              board.win.__mpeFixture.feed(frame.gameover);
              return raf(board.win);
            }).then(function () {
              if (!board.doc.querySelector('#endcard.on')) {
                problems.push(width + ' px: the endcard never came up');
              }
              totalDrawn += mirror(board, width + ' px endcard').drawn;
            });
          });
        });
        return chain.then(function () {
          if (problems.length) throw new Error(problems.join('; '));
          if (totalDrawn < MIN_STRINGS) {
            throw new Error('only ' + totalDrawn + ' strings were laid out; ' +
              'the fixture measured nothing');
          }
          // Same signal, and in the same order, as the real shell: the
          // attribute goes up AFTER the frames are on the canvas.
          return new Promise(function (resolve) {
            requestAnimationFrame(function () {
              document.documentElement.setAttribute('data-replay-loaded', 'true');
              document.documentElement.setAttribute(
                'data-fixture-strings', String(totalDrawn));
              resolve();
            });
          });
        });
      })
      .catch(function (error) {
        fail(error && error.message ? error.message : error);
      });
  }

  main();
})();
</script>
</body>
</html>
